# Omnigraph Configuration
# Using local RustFS S3 for CRM repo

graphs:
  local_s3:
    uri: s3://omnigraph-local/crm-repo

server:
  graph: local_s3
  bind: 127.0.0.1:8080

cli:
  graph: local_s3
  branch: main
  output_format: jsonl

query:
  roots: [queries, .]

auth:
  env_file: .env.omni

# Schema path for init/apply operations
schema: ./schema.pg
