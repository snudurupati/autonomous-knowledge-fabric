# Omnigraph Configuration
# Using fresh repo to avoid corrupted staging state

graphs:
  local_s3:
    uri: s3://omnigraph-local/crm-test

server:
  graph: local_s3
  bind: 0.0.0.0:8080

cli:
  graph: local_s3
  branch: main
  output_format: jsonl

query:
  roots: [queries, .]

auth:
  env_file: .env.omni

# Schema path for init/apply operations
schema: ./schema.pg
